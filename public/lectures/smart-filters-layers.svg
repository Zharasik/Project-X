<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="720" height="300" fill="#f4f4f2"/>
  <g transform="translate(180 36)">
