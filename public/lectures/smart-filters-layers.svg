    <line x1="0" y1="42" x2="360" y2="42" stroke="#ececea"/>
    <g transform="translate(12 54)">
      <rect width="336" height="40" rx="6" fill="#eef0ff"/>
      <rect x="10" y="8" width="34" height="24" rx="3" fill="#c7cbe0"/>
